name: Flatpak

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream python3-pil

      - name: Build bundle
        env:
          GITHUB_ACTIONS: true
        run: |
          chmod +x build.sh
          python3 generate_icon.py
          ./build.sh --bundle

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: steam-audio-isolator-x86_64.flatpak
