name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Building version $VERSION from tag"
        sed -i "s/^__version__ = .*/__version__ = '$VERSION'/" steam_pipewire/__init__.py
        sed -i "s/^    version=.*/    version='$VERSION',/" setup.py

    - name: Sync Flatpak AppStream release (tags only)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        DATE=$(date +%Y-%m-%d)
        sed -i "s|version=\"[0-9.]*\" date=\"[0-9-]*\"|version=\"${VERSION}\" date=\"${DATE}\"|" \
          flatpak/io.github.crashman79.steam-audio-isolator.metainfo.xml

    - name: Install Flatpak build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder appstream python3-pil

    - name: Icons
      run: python3 generate_icon.py

    - name: Build Flatpak bundle
      env:
        GITHUB_ACTIONS: true
      run: |
        chmod +x build.sh
        BUILD_DIR=build-flatpak ./build.sh --bundle

    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        else
          echo "version=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi

    - name: Extract changelog
      if: startsWith(github.ref, 'refs/tags/')
      run: python3 .github/scripts/extract_changelog.py
      env:
        VERSION: ${{ env.VERSION }}
        GITHUB_REPOSITORY: ${{ github.repository }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          steam-audio-isolator-x86_64.flatpak
        body_path: release_changelog.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: steam-audio-isolator-flatpak
        path: |
          steam-audio-isolator-x86_64.flatpak
