name: Build Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Building version $VERSION from tag"
        sed -i "s/^__version__ = .*/__version__ = '$VERSION'/" steam_pipewire/__init__.py
        sed -i "s/^    version=.*/    version='$VERSION',/" setup.py

    - name: Build release
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Sync Flatpak AppStream release (tags only)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        DATE=$(date +%Y-%m-%d)
        sed -i "s|version=\"[0-9.]*\" date=\"[0-9-]*\"|version=\"${VERSION}\" date=\"${DATE}\"|" \
          flatpak/io.github.crashman79.steam-audio-isolator.metainfo.xml

    - name: Build Flatpak bundle
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder python3-pil
        python3 generate_icon.py
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
        flatpak-builder --user --repo=repo --default-branch=stable --force-clean build-flatpak \
          flatpak/io.github.crashman79.steam-audio-isolator.yml
        flatpak build-bundle repo steam-audio-isolator-x86_64.flatpak \
          io.github.crashman79.steam-audio-isolator stable
    
    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        else
          echo "version=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
        fi

    - name: Extract changelog
      if: startsWith(github.ref, 'refs/tags/')
      run: python3 .github/scripts/extract_changelog.py
      env:
        VERSION: ${{ env.VERSION }}
        GITHUB_REPOSITORY: ${{ github.repository }}
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/steam-audio-isolator-linux-x86_64.tar.gz
          dist/steam-audio-isolator-linux-x86_64-portable.tar.gz
          dist/release/steam-audio-isolator
          steam-audio-isolator-x86_64.flatpak
        body_path: release_changelog.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: steam-audio-isolator-linux-x86_64
        path: |
          dist/steam-audio-isolator-linux-x86_64.tar.gz
          dist/steam-audio-isolator-linux-x86_64-portable.tar.gz
          steam-audio-isolator-x86_64.flatpak
