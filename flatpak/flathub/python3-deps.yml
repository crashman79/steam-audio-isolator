# Pinned wheels for Flathub builds (no network at build time).
# PyQt6 comes from com.riverbankcomputing.PyQt.BaseApp//6.11.
name: python3-deps
buildsystem: simple
build-commands:
  - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
      --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps "darkdetect==0.8.0"
sources:
