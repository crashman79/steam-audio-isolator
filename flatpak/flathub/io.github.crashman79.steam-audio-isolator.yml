# Flathub submission manifest (copy this + python3-deps.yml to the root of your flathub fork branch).
#
# Local test (install runtimes once):
#   flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 \
#     com.riverbankcomputing.PyQt.BaseApp//6.11
#   flatpak-builder --user --install --force-clean build-dir flatpak/flathub/io.github.crashman79.steam-audio-isolator.yml
#
# Lint:
#   flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest flatpak/flathub/io.github.crashman79.steam-audio-isolator.yml

app-id: io.github.crashman79.steam-audio-isolator
branch: stable
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: steam-audio-isolator

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'

# dbus: Qt tray + notifications. Session bus: platform style / system palette (same idea as SinkSwitch).
finish-args:
  - --share=ipc
  - --socket=session-bus
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.kde.StatusNotifierWatcher
  # Qt tray icons register as a StatusNotifierItem and need to own a unique bus name.
  - --own-name=org.kde.StatusNotifierItem.*
  - --talk-name=org.freedesktop.StatusNotifierWatcher
  - --own-name=org.freedesktop.StatusNotifierItem.*
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-config/steam-audio-isolator:create
  - --filesystem=xdg-config/autostart:create
  - --filesystem=xdg-cache/steam-audio-isolator:create
  - --filesystem=xdg-data/applications:create
  - --filesystem=xdg-data/icons:create

modules:
  - name: pipewire
    buildsystem: meson
    config-opts:
      - -Dsession-managers=[]
      - -Ddocs=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
      - -Dinstalled_tests=disabled
      - -Dman=disabled
      - -Dgstreamer=disabled
      - -Dffmpeg=disabled
      - -Dbluez5=disabled
      - -Djack=disabled
      - -Dpipewire-jack=disabled
      - -Dpipewire-alsa=disabled
      - -Dpipewire-v4l2=disabled
      - -Dv4l2=disabled
      - -Dalsa=disabled
      - -Dlibcamera=disabled
      - -Droc=disabled
      - -Dudev=disabled
      - -Dsystemd-system-service=disabled
      - -Dsystemd-user-service=disabled
      - -Dflatpak=enabled
      # 25.08 installs to /app/lib64 by default, but the Flatpak loader only
      # searches /app/lib. Keep the bundled client library discoverable.
      - --libdir=lib
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.10/pipewire-1.6.10.tar.bz2
        sha256: e67763b75d6fa907ef9ff856cfdcaf7f8498baba858fa8951b0aff25be626765
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/alsa
      - '*.a'

  - python3-deps.yml

  - name: steam-audio-isolator
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-build-isolation --prefix=${FLATPAK_DEST} --no-deps .
      - rm -f ${FLATPAK_DEST}/share/applications/steam-audio-isolator.desktop
      - install -Dpm644 flatpak/io.github.crashman79.steam-audio-isolator.desktop ${FLATPAK_DEST}/share/applications/io.github.crashman79.steam-audio-isolator.desktop
      - install -Dpm644 flatpak/io.github.crashman79.steam-audio-isolator.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.crashman79.steam-audio-isolator.metainfo.xml
      - |
        for s in 16 24 32 48 64 128 256; do
          f="steam-audio-isolator-${s}.png"
          if test -f "$f"; then
            install -Dpm644 "$f" \
              "${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/io.github.crashman79.steam-audio-isolator.png"
          fi
        done
    sources:
      # v0.5.0 is the latest release. Pin the resulting commit when preparing
      # the actual Flathub submission.
      - type: git
        url: https://github.com/crashman79/steam-audio-isolator.git
        tag: v0.5.0
        commit: 4774bd2bf914596f68ea0e1b83b903d079c09291
